services:
  # -----------------------------
  # DATABASE SERVICE
  # -----------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------
  # API SERVICE
  # -----------------------------
  api:
    build: 
      context: ./backend  # Points to the backend folder
    restart: always
    depends_on:
      db:
        condition: service_healthy # Wait for DB to be actually ready
    ports:
      - "8000:8000"
    environment:
      # App Settings
      - APP_ENV=production
      - LOG_LEVEL=INFO
      
      # Database Connection (Matches 'db' service name internally)
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  postgres_data: